<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRIDFALL</title>
<style>
:root{
  --void:#07060f; --deep:#0e0c1e; --panel:#15122c; --panel2:#1d1940;
  --line:#2b2558; --line2:#3d3475; --txt:#d3d0ea; --dim:#7a74a8;
  --cyan:#4de8ff; --cyan-d:#1d7f96; --mag:#ff4d8f; --mag-d:#8a2a4e;
  --gold:#ffc94d; --violet:#9d6bff; --green:#5dffa0;
  --tp:#153a5c; --tpb:rgba(77,232,255,.42); --te:#4a1730; --teb:rgba(255,77,143,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--txt);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:0.8125rem;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(77,232,255,.013) 3px 4px)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:linear-gradient(135deg,var(--cyan),#2fb6d4);color:#06121a;font-size:0.625rem;
  letter-spacing:.16em;text-transform:uppercase;padding:.72rem 1.3rem;font-weight:700;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d99f22);color:#150f02}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);clip-path:none}
.btn.ghost:hover{color:var(--txt);border-color:var(--cyan-d)}
.btn:disabled{opacity:.3;cursor:not-allowed;filter:none}
.sect{font-size:0.5312rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:14px 0 7px}
.sect:first-child{margin-top:0}
.mini{font-size:0.5312rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;
  border:1px solid var(--line);padding:.45rem .7rem}
.mini:hover{color:var(--cyan);border-color:var(--cyan-d)}

/* ============ BOOT ============ */
#boot{align-items:center;justify-content:center;padding:24px;overflow:auto;
  background:radial-gradient(ellipse at 50% 30%,#1a1440 0%,var(--void) 68%)}
.bootwrap{width:100%;max-width:clamp(360px,32vw,560px)}
.wordmark{font-size:2.375rem;font-weight:700;letter-spacing:.32em;text-align:center;line-height:1;
  background:linear-gradient(180deg,var(--cyan),var(--violet));-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(77,232,255,.32))}
.bootsub{text-align:center;margin:11px 0 32px;font-size:0.5625rem;letter-spacing:.24em;
  color:var(--dim);text-transform:uppercase}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:flex;
  justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;transition:.13s;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.slot:hover{border-color:var(--cyan-d);background:var(--panel2);box-shadow:0 0 24px rgba(77,232,255,.10)}
.slot .cs{font-size:0.8125rem;font-weight:700;letter-spacing:.12em;color:var(--cyan)}
.slot.empty .cs{color:var(--dim)}
.slot .meta{font-size:0.5625rem;color:var(--dim);margin-top:4px}
.slot .del{font-size:0.5625rem;color:var(--dim);padding:5px 7px}
.slot .del:hover{color:var(--mag)}
#newform{display:none;flex-direction:column;gap:10px}
#newform.on{display:flex}
input{font-family:inherit;font-size:0.875rem;letter-spacing:.16em;text-transform:uppercase;
  background:var(--panel);border:1px solid var(--line2);color:var(--cyan);padding:12px 14px;
  width:100%;outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 18px rgba(77,232,255,.14)}

/* ============ HOLD ============ */
#hold{background:var(--deep)}
#vibe{position:absolute;inset:0;display:flex}
.holdgrid{flex:1;display:grid;grid-template-columns:1fr minmax(380px,32%);min-height:0}
@media(max-width:900px){.holdgrid{grid-template-columns:1fr;grid-template-rows:22vh 1fr}}
.port{position:relative;overflow:hidden;background:#04030b;border-right:1px solid var(--line)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.portframe{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 36px rgba(7,6,15,.95)}
.strut{position:absolute;background:var(--panel);opacity:.9;pointer-events:none;
  border-left:1px solid var(--line2);border-right:1px solid #05040c}
.portlabel{position:absolute;left:16px;bottom:14px;font-size:0.5312rem;letter-spacing:.2em;
  color:var(--dim);text-transform:uppercase}
.portlabel b{color:var(--cyan)}
.bay{display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,var(--panel) 0%,var(--deep) 50%)}
.baytop{display:flex;justify-content:space-between;gap:12px;padding:16px 19px 13px;border-bottom:1px solid var(--line)}
.who .cs{font-size:1.0625rem;font-weight:700;letter-spacing:.16em;color:var(--cyan)}
.who .rk{font-size:0.5625rem;letter-spacing:.14em;color:var(--dim);margin-top:3px;text-transform:uppercase}
.purse{display:flex;gap:16px;text-align:right}
.purse .k{font-size:0.5rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.purse .v{font-size:1.0625rem;font-weight:700}
.purse .cr .v{color:var(--gold)} .purse .sa .v{color:var(--cyan)}
.baymain{flex:1;overflow-y:auto;padding:16px 19px;display:flex;flex-direction:column;gap:10px}
.deploy{position:relative;border:1px solid var(--cyan-d);text-align:left;padding:22px;
  background:linear-gradient(135deg,#16304a 0%,#1b1440 100%);overflow:hidden;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.deploy:hover{border-color:var(--cyan);box-shadow:0 0 32px rgba(77,232,255,.16)}
.deploy .lamp{position:absolute;top:0;left:0;right:0;height:2px;background:var(--cyan);
  animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,100%{opacity:.25}50%{opacity:1}}
.deploy h2{font-size:1.625rem;font-weight:700;letter-spacing:.2em;color:var(--cyan);line-height:1;
  text-shadow:0 0 18px rgba(77,232,255,.4)}
.deploy .sub{font-size:0.5938rem;color:var(--dim);margin-top:9px;line-height:1.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);padding:14px;text-align:left;transition:.12s}
.tile:hover{border-color:var(--line2);background:var(--panel2)}
.tile .tn{font-size:0.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tile .td{font-size:0.5312rem;color:var(--dim);margin-top:5px;line-height:1.45}
.tile.sq .tn{color:var(--cyan)} .tile.qm .tn{color:var(--gold)}
.tile.db .tn{color:var(--mag)} .tile.rec .tn{color:var(--violet)}
.bayfoot{display:flex;gap:7px;padding:11px 19px;border-top:1px solid var(--line);
  align-items:center;justify-content:space-between}

/* ============ PANEL ============ */
#panel{position:fixed;inset:0;background:rgba(6,5,13,.96);display:none;flex-direction:column;z-index:40}
#panel.on{display:flex}
/* shared bottom navigation — consistent with the combat action bar */
.navfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:clamp(9px,1vw,14px) clamp(12px,1.3vw,20px);border-top:1px solid var(--line);
  background:var(--panel);flex:0 0 auto}
.navfoot h2{font-size:0.6875rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cyan);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navfoot .btn{flex:0 0 auto;padding:.8rem 1.3rem}
@media(max-width:520px){
  .navfoot{gap:9px;padding:9px 11px}
  .navfoot h2{font-size:0.5938rem;letter-spacing:.14em}
  .navfoot .btn{padding:12px 15px;font-size:0.5625rem}
}
.pbody{flex:1;overflow-y:auto;padding:clamp(12px,1.4vw,24px);max-width:min(96vw,2100px);width:100%;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;background:var(--panel);
  border:1px solid var(--line);padding:.8rem 1rem;font-size:0.6875rem;flex-wrap:wrap}
.bar b{color:var(--gold);font-size:0.9375rem}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{font-size:0.5938rem;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;
  border:1px solid var(--line);color:var(--dim)}
.tab.on{border-color:var(--cyan);color:var(--cyan);background:rgba(77,232,255,.07)}
.stub{border:1px dashed var(--line2);padding:22px;text-align:center;color:var(--dim);font-size:0.625rem;line-height:1.9}
.stub b{color:var(--cyan);display:block;font-size:0.6875rem;letter-spacing:.16em;margin-bottom:5px}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.row{background:var(--deep);padding:.7rem .9rem;display:flex;justify-content:space-between;gap:12px;font-size:0.6875rem}
.row .r{color:var(--dim);font-size:0.625rem} .row .r.hot{color:var(--gold)}
.row.locked{opacity:.4}

/* ============ CARD GRID ============ */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(62px,4.6vw,84px),1fr));gap:clamp(4px,.35vw,6px)}

.gcard{position:relative;background:linear-gradient(170deg,var(--panel2) 0%,var(--deep) 62%);
  border:1px solid var(--line2);text-align:left;overflow:hidden;transition:.14s;
  display:flex;flex-direction:column;
  clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.gcard:hover{filter:brightness(1.1)}
.gcard.t-common{border-color:#4a5570}
.gcard.t-common:hover{border-color:#8d9bbd;box-shadow:0 0 22px rgba(140,155,190,.2)}
.gcard.t-tech{border-color:var(--cyan-d)}
.gcard.t-tech:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(77,232,255,.26)}
.gcard.t-special{border-color:#9a7420}
.gcard.t-special:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(255,201,77,.28)}
.gcard.owned{opacity:.5} .gcard.cant{opacity:.32}
.gcard.indeck{border-color:var(--green);box-shadow:0 0 0 1px rgba(93,255,160,.5)}
.gart{position:relative;background:radial-gradient(ellipse at 50% 120%,#2a2158 0%,#0d0b1c 72%);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.gart svg{width:62%;height:62%;opacity:.94}
.gcost{position:absolute;top:2px;left:2px;width:14px;height:14px;font-size:0.5312rem;display:flex;align-items:center;
  justify-content:center;background:var(--gold);color:#140f02;font-size:0.6875rem;font-weight:700}
.ghp{position:absolute;top:2px;right:2px;font-size:0.4062rem;font-weight:700;color:var(--cyan);
  background:rgba(7,6,15,.85);padding:2px 3px}
.gname{font-size:0.4688rem;font-weight:700;letter-spacing:0;padding:.28rem .28rem 0;line-height:1.15;
  min-height:calc(1.15em * 2 + 4px);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.gtype{display:none}
.gtxt{display:none}
.gfoot{padding:.22rem .34rem;margin-top:auto;border-top:1px solid var(--line);font-size:0.4062rem;letter-spacing:0;
  text-transform:uppercase;text-align:right;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gfoot.buy{color:var(--gold)} .gfoot.own{color:var(--green)} .gfoot.no{color:var(--dim)}
.gfoot.add{color:var(--cyan)} .gfoot.rem{color:var(--mag)}

/* ============ FOCUS / BOKEH ============ */
#focus{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#focus.on{display:flex;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fbg{position:absolute;inset:0;background:rgba(7,6,15,.62);
  backdrop-filter:blur(16px) saturate(.7);-webkit-backdrop-filter:blur(16px) saturate(.7)}
.bok{position:absolute;border-radius:50%;filter:blur(22px);opacity:.4;pointer-events:none;
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(28px,-38px,0) scale(1.24)}}
.fwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;
  max-height:100%;overflow:auto}
.fcard{width:clamp(280px,24vw,520px);background:linear-gradient(170deg,var(--panel2) 0%,var(--deep) 64%);
  border:2px solid var(--line2);display:flex;flex-direction:column;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
  animation:pop .22s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.fcard.t-common{border-color:#8d9bbd;box-shadow:0 0 60px rgba(140,155,190,.3)}
.fcard.t-tech{border-color:var(--cyan);box-shadow:0 0 60px rgba(77,232,255,.34)}
.fcard.t-special{border-color:var(--gold);box-shadow:0 0 66px rgba(255,201,77,.36)}
.fart{height:170px;position:relative;background:radial-gradient(ellipse at 50% 118%,#332771 0%,#0b0918 74%);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.fart svg{width:118px;height:118px}
.fcost{position:absolute;top:.7rem;left:.7rem;width:2.3rem;height:2.3rem;display:flex;align-items:center;
  justify-content:center;background:var(--gold);color:#140f02;font-size:1.125rem;font-weight:700}
.fhp{position:absolute;top:11px;right:11px;font-size:0.75rem;font-weight:700;color:var(--cyan);
  background:rgba(7,6,15,.85);padding:6px 9px}
.fname{font-size:1.0625rem;font-weight:700;letter-spacing:.1em;padding:.9rem 1rem 0}
.ftype{font-size:0.5312rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:5px 16px 0}
.ftxt{font-size:0.6562rem;color:var(--txt);line-height:1.65;padding:.8rem 1rem}
.fstats{border-top:1px solid var(--line);padding:.7rem 1rem;display:flex;flex-direction:column;gap:5px}
.fstat{display:flex;justify-content:space-between;font-size:0.5938rem}
.fstat .k{color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.fstat .v{color:var(--cyan);font-weight:700}
.fab{border-top:1px solid var(--line);padding:11px 16px;font-size:0.5938rem;line-height:1.55;color:var(--violet)}
.fab b{color:var(--gold);display:block;font-size:0.5625rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.facts{display:flex;gap:8px;width:300px}
.facts .btn{flex:1;text-align:center}

/* ============ MAP ============ */
#map{background:radial-gradient(ellipse at 50% 0%,#141034 0%,var(--void) 70%)}
.mapbody{flex:1;overflow:auto;padding:clamp(12px,1.4vw,24px);width:100%;margin:0 auto;max-width:min(96vw,1900px)}
.mapwrap{display:grid;grid-template-columns:1fr;gap:clamp(12px,1.4vw,24px)}
@media(min-width:900px){.mapwrap{grid-template-columns:1.6fr 1fr;align-items:start}}
.mapsvg{border:1px solid var(--line);background:#080714}

/* ============ COMBAT ============ */
#combat{background:var(--deep)}

  

@media(min-width:1080px){
  
  
}

@media(max-width:520px){}

 
.board{display:grid;gap:2px}
.cell{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:1px;overflow:hidden;transition:background .18s,box-shadow .15s}
.t-p{background:var(--tp);box-shadow:inset 0 0 0 1px var(--tpb)}
.t-e{background:var(--te);box-shadow:inset 0 0 0 1px var(--teb)}
.t-n{background:#12101f;box-shadow:inset 0 0 0 1px rgba(122,116,168,.16)}
.t-x{background:#0a0912;box-shadow:inset 0 0 0 1px rgba(122,116,168,.07);opacity:.5}
.cell.valid{background:#1f6a86;box-shadow:inset 0 0 0 2px var(--cyan),0 0 14px rgba(77,232,255,.3);cursor:pointer}
.cell.valid:hover{background:#2b89a8}
.cell.movesel{box-shadow:inset 0 0 0 2px var(--green),0 0 16px rgba(93,255,160,.35)}
.cell.movetgt{background:#1b4a38;box-shadow:inset 0 0 0 2px var(--green);cursor:pointer}
.cell.movetgt:hover{background:#256349}
.cell.orderdest{box-shadow:inset 0 0 0 2px var(--green)}
.cell.objtile{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.scorch{background:#4a2a12;box-shadow:inset 0 0 0 1px rgba(255,140,60,.5)}
.cell.clickable{cursor:pointer}
.ent{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border:1px solid;padding:1px;position:relative}
.ent .nm{font-size:0.4375rem;font-weight:700;text-align:center;line-height:1.05}
.ent .hp{font-size:0.625rem;font-weight:700;line-height:1.1}
.p-unit{background:#14304d;border-color:var(--cyan-d);color:var(--cyan)}
.p-struct{background:#152a3a;border-color:#2b5f75;color:#8fd4e6}
.p-spec{background:#3a2c12;border-color:#9a7420;color:var(--gold)}
.e-unit{background:#3d1428;border-color:var(--mag-d);color:#ff8fb5}
.e-tech{background:#2d1440;border-color:#6b3a9a;color:#c79bff}
.e-spec{background:#4a1020;border-color:#c23a5e;color:#ff6f9a}
.anchor{outline:1px dashed rgba(255,255,255,.16);outline-offset:-3px}
.ord{position:absolute;bottom:0;right:1px;font-size:0.5rem;font-weight:700}
.ord.done{color:var(--green)}
.ent.spent{filter:grayscale(.85) brightness(.55);opacity:.8}
.hintline{font-size:0.5rem;color:var(--dim);margin-top:7px;letter-spacing:.04em}
.shield{position:absolute;top:0;left:1px;font-size:0.4375rem;color:var(--cyan)}
.att{position:absolute;bottom:0;left:1px;font-size:0.4375rem;color:var(--gold)}
.terbar{height:6px;display:flex;margin-top:9px;border:1px solid var(--line)}
.terbar i{display:block;height:100%}
.terbar .p{background:var(--cyan)} .terbar .n{background:#241f45} .terbar .e{background:var(--mag)}

.box{background:var(--panel);border:1px solid var(--line);padding:.65rem .8rem}
.box h3{font-size:0.5312rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  margin-bottom:7px;font-weight:700}
.box .obtxt{font-size:0.5938rem;line-height:1.55;color:var(--txt)}
.box .obsub{font-size:0.5312rem;color:var(--dim);margin-top:6px;line-height:1.5}
.mrow{display:flex;justify-content:space-between;font-size:0.625rem;padding:2px 0}
.mrow .c{color:#ff8fb5}
.note{font-size:0.5rem;color:var(--dim);margin-top:7px;line-height:1.5}

@media(max-width:1079px){}

.hc .zoom{position:absolute;top:4px;right:24px;font-size:0.5625rem;color:var(--dim);
  width:15px;height:15px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2)}
.hc .zoom:hover{color:var(--cyan);border-color:var(--cyan)}

.result{position:fixed;inset:0;background:rgba(6,5,13,.94);display:none;align-items:center;
  justify-content:center;z-index:70;padding:24px}
.result.on{display:flex}
.rcard{background:var(--panel);border:1px solid var(--line2);padding:30px;max-width:400px;width:100%;text-align:center}
.rcard h2{font-size:1.25rem;letter-spacing:.2em;margin-bottom:6px}
.rcard.win h2{color:var(--green)} .rcard.lose h2{color:var(--mag)}
.rcard .rs{font-size:0.625rem;color:var(--dim);line-height:1.95;margin:15px 0 22px}

.modegrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:6px}
@media(min-width:700px){.modegrid{grid-template-columns:repeat(3,1fr)}}
.modecard{background:linear-gradient(170deg,var(--panel2),var(--deep));border:1px solid var(--line2);
  text-align:left;padding:15px 16px;display:flex;flex-direction:column;gap:7px;transition:.14s;
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.modecard.live:hover{border-color:var(--oc);box-shadow:0 0 30px -8px var(--oc);filter:brightness(1.08)}
.mname{font-size:0.8125rem;font-weight:700;letter-spacing:.16em;color:var(--oc);text-transform:uppercase}
.mdesc{font-size:0.5312rem;color:var(--dim);line-height:1.6;flex:1}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.5312rem;

.bstats{display:flex;gap:16px;margin-top:8px;font-size:0.5rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.bstats b{color:var(--cyan);font-size:0.6875rem;margin-left:5px}
.bstats .of{color:var(--dim);font-size:0.5rem}

.box.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.selbox{flex:0 0 auto;max-height:44%;display:flex;flex-direction:column;padding:.65rem .8rem}
.selbox #selinfo{font-size:0.5625rem;color:var(--dim);line-height:1.6;flex:1;min-height:0;overflow-y:auto}
.handbox{min-height:0;display:flex;flex-direction:column;flex:1}
.handbox h3{display:flex;justify-content:space-between;align-items:center}
.dpchip{font-size:0.4688rem;letter-spacing:.1em;color:var(--dim)}
.dpchip b{color:var(--gold);font-size:0.75rem;margin-right:3px}
.handbox .hcards{overflow-y:auto;min-height:0;flex:1}
.cbacts{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:8px}
.cbacts .btn{padding:.85rem 1.2rem;text-align:center;font-size:0.625rem}
.cbacts .btn.ghost{padding:13px 16px;color:var(--dim);border:1px solid var(--line2)}
.cbacts .btn.ghost:hover{color:var(--mag);border-color:var(--mag-d)}
.btn.danger{background:linear-gradient(135deg,var(--mag),#c2306a);color:#1a0510}
.btn.danger:hover{filter:brightness(1.12)}

.hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hc{width:auto;background:linear-gradient(170deg,var(--panel2),var(--deep));
  border:1px solid var(--line2);padding:.45rem .55rem;cursor:pointer;transition:.1s;position:relative}
.hc:hover{filter:brightness(1.18)}
.hc.t-tech{border-color:var(--cyan-d)} .hc.t-special{border-color:#9a7420}
.hc.sel{border-color:var(--green);box-shadow:0 0 16px rgba(93,255,160,.28)}
.hc.poor{opacity:.3;cursor:not-allowed;filter:none}
.hc .n{font-size:0.5625rem;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.hc .n span:last-child{color:var(--gold)}
.hc .d{font-size:0.4375rem;color:var(--dim);margin-top:3px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media(min-width:1000px){
  .cbmain{grid-template-columns:minmax(0,1fr) clamp(260px,21vw,520px);overflow:hidden}
  .cbcol{overflow-y:auto}
  .cbcol.mid{overflow:hidden;justify-content:center}
  .field{max-width:min(100%,calc((100vh - 11rem) * 1.62))}
}
@media(min-width:1800px){.cbmain{grid-template-columns:minmax(0,1fr) clamp(340px,21vw,560px)}}
@media(max-width:999px){
  .cbmain{overflow:auto}
  .selbox{max-height:none}
  .cbhead{gap:7px;padding:8px 10px}
  .mtitle b{font-size:0.625rem}
  .incoming{order:3;width:100%;flex:0 0 auto}
  .cbhead .btn{padding:9px 15px}
}
@media(max-width:560px){.hcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function migrate(p){if(!p||typeof p!=='object')return null;

function sigil(id,tier,size,tint){
  const col=tint||(tier==='special'?'#ffc94d':tier==='tech'?'#4de8ff':'#9aa6c8');
  let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
  const r=n=>{h=(h*1103515245+12345)>>>0;return (h>>>16)%n;};
  let p='';const rings=1+r(2),spokes=4+r(5);
  for(let i=0;i<spokes;i++){const a=(i/spokes)*Math.PI*2;
    p+=`<line x1="26" y1="26" x2="${(26+Math.cos(a)*20).toFixed(1)}" y2="${(26+Math.sin(a)*20).toFixed(1)}" stroke="${col}" stroke-width="1.1" opacity=".55"/>`;}
  for(let i=0;i<rings;i++)p+=`<circle cx="26" cy="26" r="${8+i*7+r(4)}" fill="none" stroke="${col}" stroke-width="1.2" opacity=".8"/>`;
  const sides=3+r(4),pts=[];
  for(let i=0;i<sides;i++){const a=(i/sides)*Math.PI*2-Math.PI/2;
    pts.push(`${(26+Math.cos(a)*13).toFixed(1)},${(26+Math.sin(a)*13).toFixed(1)}`);}
  p+=`<polygon points="${pts.join(' ')}" fill="${col}" opacity=".22" stroke="${col}" stroke-width="1.3"/>`;
  return `<svg viewBox="0 0 52 52"${size?` style="width:${size}px;height:${size}px"`:''}>${p}</svg>`;
}

let raf=null,skyT=0,W=0,H=0,layers=[],stars=[],last=0,cv=null,cx=null;
function sizeSky(){if(!cv)return;const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);
  cx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;buildSky();}
function buildSky(){layers=[];stars=[];
  [{y:.60,a:.055,s:.10,c:'#0e0d24'},{y:.72,a:.075,s:.22,c:'#141130'},{y:.86,a:.10,s:.46,c:'#1c1740'}]
    .forEach(o=>{const pts=[];for(let i=0;i<28;i++)pts.push(Math.random());layers.push({...o,pts,off:Math.random()*900});});
  for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.55,a:.15+Math.random()*.6,tw:Math.random()*6.3});}
function drawSky(dt){skyT+=dt;
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04030b');g.addColorStop(.4,'#0a0820');g.addColorStop(.66,'#191138');g.addColorStop(1,'#3a1436');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  stars.forEach(s=>{cx.fillStyle=`rgba(190,210,255,${s.a*(.6+.4*Math.sin(skyT*1.6+s.tw))})`;cx.fillRect(s.x*W,s.y*H,1.2,1.2);});
  const hz=cx.createLinearGradient(0,H*.5,0,H*.74);
  hz.addColorStop(0,'rgba(255,77,143,0)');hz.addColorStop(1,'rgba(255,77,143,.13)');
  cx.fillStyle=hz;cx.fillRect(0,H*.5,W,H*.24);
  layers.forEach(L=>{L.off+=dt*L.s*W*.14;cx.beginPath();cx.moveTo(0,H);
    const n=L.pts.length,seg=W/(n-2);
    for(let i=0;i<n;i++){const x=i*seg-(L.off%seg),idx=(i+Math.floor(L.off/seg))%n;
      cx.lineTo(x,H*L.y-L.pts[(idx+n)%n]*H*L.a);}
    cx.lineTo(W,H);cx.closePath();cx.fillStyle=L.c;cx.fill();});
  const px=(Math.sin(skyT*2.2)+1)/2;
  cx.fillStyle=`rgba(77,232,255,${.25+px*.65})`;cx.fillRect(W*.78,H*.7,2,2);
  cx.fillStyle=`rgba(77,232,255,${.05+px*.1})`;cx.beginPath();cx.arc(W*.78+1,H*.7+1,9+px*6,0,6.283);cx.fill();
  const v=$('vibe');if(v)v.style.transform=`translate3d(0,${((Math.sin(skyT*23)+Math.sin(skyT*37))*.32).toFixed(2)}px,0)`;
  const t=214,l=Math.max(0,t-Math.floor(skyT)%t);
  $('eta').textContent='T−'+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');}

  const ter=[];for(let l=0;l<LANES;l++){ter.push([]);for(let c=0;c<COLS;c++)ter[l].push(c<3?'p':c>4?'e':'n');}

     endless:!!nd.endless,gauntlet:!!nd.gauntlet,waves:nd.endless?9999:m.waves,turn:1,dp:MAXDP,
     breaches:0,over:false,ter,scorch:{},deck:shuffle([...deck]),hand:[],units:[],enemies:[],

  clog(`<span class="t">${m.n.toUpperCase()}</span> — ${m.d}`);

function abortMission(){
  const wasE=G&&G.endless,wasG=G&&G.gauntlet;
  if(wasG)active.gaunt=null;
  G=null;sel=null;mover=null;
  $('result').classList.remove('on');closeFocus();commit();
  if(wasE||wasG){show('modes');renderModes();return;}
  show('map');renderMap();}
function wave(t){if(t>G.waves)return null;
  let budget=Math.round(2+t*(G.endless?1.9:1.5)),pool=['crawler'];
  if(t>=2)pool.push('hulk','breacher');
  if(t>=3)pool.push('spitter','burrower');
  if(t>=4||G.mod==='nest')pool.push('spore','jammer','pylon');
  if(t>=5)pool.push('harrower');
  if((t>=G.waves||(G.endless&&t>=7))&&G.type!=='extract')pool.push('chorus','sovereign');
  if(G.type==='purge')pool=pool.concat(['spore','pylon','jammer']);
  if(G.type==='specimens'&&G.quotaK)pool.push(G.quotaK,G.quotaK);
  const out={};let g=0,spec=0;
  while(budget>0&&g++<60){
    const aff=pool.filter(k=>BEST[k].threat<=budget&&(BEST[k].t!=='special'||spec<1));
    if(!aff.length)break;const k=aff[(Math.random()*aff.length)|0];
    if(BEST[k].t==='special')spec++;out[k]=(out[k]||0)+1;budget-=BEST[k].threat;}
  if(G.mod==='swarm'&&out.crawler)out.crawler*=2;return out;}
function clog(h,cat){G.logs.unshift({h,c:cat||'info'});if(G.logs.length>120)G.logs.pop();}
function unitAt(l,c){return G.units.find(u=>u.lane===l&&c>=u.col&&c<u.col+u.size);}

function civAt(l,c){return G.civ.find(v=>v.l===l&&v.c===c&&v.hp>0);}
function held(){return G.ter.flat().filter(t=>t==='p').length;}
function heldEnemyHalf(){let n=0;for(let l=0;l<LANES;l++)for(let c=5;c<COLS;c++)if(G.ter[l][c]==='p')n++;return n;}
function crystalsHeld(){return G.crystals.filter(x=>G.ter[x.l][x.c]==='p').length;}
function scorched(l,c){return (G.scorch[l+','+c]||0)>0;}

/* the horde preview — deterministic so the player can shape it */
function laneScore(l){let s=0;
  G.units.forEach(u=>{if(u.lane===l)s+=(u.dmg||0)*1.6+u.hp*.12+(u.blocker?3:0);});
  for(let c=0;c<COLS;c++)if(G.ter[l][c]==='p')s+=.4;return s;}
const DOCTRINE=[
 {k:'focus', w:26,n:'Concentrated push'},
 {k:'spread',w:38,n:'Broad assault'},
 {k:'probe', w:36,n:'Probing attack'}];
function rollDoctrine(){
  const tot=DOCTRINE.reduce((a,d)=>a+d.w,0);let r=Math.random()*tot;
  for(const d of DOCTRINE){if((r-=d.w)<0)return d.k;}
  return 'probe';}
function predictSpawns(){G.predict=[];
  if(!G.manifest)return;
  const open=[...Array(LANES).keys()].filter(l=>G.ter[l][0]!=='x');
  if(!open.length)return;
  G.doctrine=G.doctrine||'probe';
  const scored=open.map(l=>({l,v:laneScore(l)})).sort((a,b)=>a.v-b.v);
  const list=[];
  for(const k in G.manifest)for(let i=0;i<G.manifest[k];i++)list.push(k);
  const load={};
  list.forEach((k,idx)=>{
    let lane;
    if(G.doctrine==='focus'){
      // hammer the two softest lanes
      lane=scored[idx%Math.min(2,scored.length)].l;
    }else if(G.doctrine==='spread'){
      // one per lane, cycling, softest first
      lane=scored[idx%scored.length].l;
    }else{
      // weakest lane, but each arrival makes it less attractive
      lane=open.map(l=>({l,v:laneScore(l)+(load[l]||0)*1.35}))
        .sort((a,b)=>a.v-b.v)[0].l;
    }
    load[lane]=(load[lane]||0)+1;
    G.predict.push({lane,k});});}
function validTiles(cid){const k=POOL[cid],out=[];
  if(k.crush){
    G.enemies.forEach(e=>{
      if(BEST[e.k].t==='special')return;
      if(G.ter[e.lane][e.col]==='x')return;
      out.push(e.lane*COLS+e.col);});
    return out;}
  if(k.instant){for(let l=0;l<LANES;l++)for(let c=0;c<COLS;c++)
    if(G.ter[l][c]==='p')out.push(l*COLS+c);
    return out;}
  if(k.attach){G.units.forEach(u=>{if(!u.att[k.attach])out.push(u.lane*COLS+u.col);});return out;}
  for(let l=0;l<LANES;l++)for(let c=0;c<COLS;c++){
    if(G.ter[l][c]==='x')continue;
    if(!k.drop&&G.ter[l][c]!=='p')continue;
    let ok=true;const sz=k.size||1;
    for(let i=0;i<sz;i++){const cc=c+i;
      if(cc>=COLS||G.ter[l][cc]==='x'){ok=false;break;}
      if(!k.drop&&G.ter[l][cc]!=='p'){ok=false;break;}
      if(unitAt(l,cc)||foeAt(l,cc)||civAt(l,cc)){ok=false;break;}}
    if(ok)out.push(l*COLS+c);}
  return out;}
function mkUnit(cid,l,c){const k=POOL[cid],g=gearOf(cid);
  const lead=leadOf();
  const hp=k.hp+(g&&g.hp?g.hp:0)+((lead.passive&&lead.passive.n==='Hardened Frames'&&k.hp)?1:0);
  return{uid:++uid,id:cid,n:k.n,t:k.t,lane:l,col:c,size:k.size||1,hp,max:hp,
    mob:!!k.mob,tg:k.tg||'none',dmg:(k.dmg||0)+(g&&g.dmg?g.dmg:0),indirect:!!k.indirect,
    blocker:!!k.blocker,aura:k.aura||0,colBuff:k.col||0,laneB:k.laneB||0,dampen:k.dampen||0,heal:k.heal||0,hot:k.hot||0,
    healType:k.healType,healMode:k.healMode,pen:!!k.pen||!!(g&&g.pen),scorch:!!k.scorch,
    cool:!!(g&&g.cool),phase:!!(g&&g.phase),choose:!!k.choose,tgt:null,pristine:k.pristine||0,
    tech:!!k.tech,regen:!!k.regen,riposte:k.riposte||0,servo:!!(g&&g.servo),ab:k.ab||null,
    att:{},acted:false,moved:false,cd:0,stun:0,regenTicks:0,phased:false,fresh:true,
    shieldMax:(k.regen?1:0)+((g&&g.shield)?g.shield:0),shield:(k.regen?1:0)+((g&&g.shield)?g.shield:0)};}
function deploy(cid,l,c){const k=POOL[cid];
  if(k.instant){
    G.dp+=k.gain||0;
    G.hand.splice(G.hand.indexOf(cid),1);
    const pool=G.hand.filter(x=>x!==cid);
    if(pool.length){const drop=pool[(Math.random()*pool.length)|0];
      G.hand.splice(G.hand.indexOf(drop),1);
      clog(`<span class="g">${k.n}</span> — +${k.gain} DP, but <span class="d">${POOL[drop].n}</span> was lost in the scramble.`);}
    else clog(`<span class="g">${k.n}</span> — +${k.gain} DP. Nothing left to lose.`);
    G.dp-=costOf(cid);
    active.usage=active.usage||{};active.usage[cid]=(active.usage[cid]||0)+1;
    sel=null;mover=null;drawAll();return;}
  if(k.attach){const u=unitAt(l,c);if(!u)return;
    u.att[k.attach]=true;if(k.attach==='shield')u.shield=1;
    clog(`<span class="g">${k.n}</span> fitted to ${u.n}.`,'order');}
  else if(k.squad){const spots=[[l,c]];
    for(let dl=-1;dl<=1&&spots.length<k.squad;dl++)for(let dc=-1;dc<=1&&spots.length<k.squad;dc++){
      if(!dl&&!dc)continue;const nl=l+dl,nc=c+dc;
      if(nl<0||nl>=LANES||nc<0||nc>=COLS)continue;
      if(G.ter[nl][nc]==='x'||unitAt(nl,nc)||foeAt(nl,nc)||civAt(nl,nc))continue;
      if(!k.drop&&G.ter[nl][nc]!=='p')continue;spots.push([nl,nc]);}
    spots.forEach(([sl,sc])=>{const u=mkUnit(cid,sl,sc);u.acted=true;G.units.push(u);
      if(k.drop){G.ter[sl][sc]='p';blast(sl,sc,k.burstBlast||0,u.n+' (impact)');}
      fire(u,true);});
    clog(`<span class="g">${k.n}</span> — ${spots.length} pods down.`,'order');}
  else{
    if(k.crush){const e=foeAt(l,c);
      if(e){G.enemies=G.enemies.filter(x=>x.uid!==e.uid);G.kills++;
        clog(`<span class="g">${k.n}</span> came down on ${BEST[e.k].n} and crushed it.`,'kill');
        if(!active.unlocks.enemies.includes(e.k))active.unlocks.enemies.push(e.k);}
      G.ter[l][c]='p';}
    const u=mkUnit(cid,l,c);G.units.push(u);
    if(k.drop){G.ter[l][c]='p';blast(l,c,k.burstBlast||0,u.n+' (impact)');}
    if(k.claim){let got=0;
      for(let i=1;i<=k.claim;i++){const cc=c+u.size-1+i;
        if(cc<COLS&&G.ter[l][cc]!=='x'&&!foeAt(l,cc)){G.ter[l][cc]='p';got++;}}
      if(got)clog(`<span class="g">${k.n}</span> claimed ${got} tile${got>1?'s':''} ahead.`);}
    fire(u,true);if(u.heal||u.hot)healPass(u,true);u.acted=true;
    if(k.dpGain){G.dp+=k.dpGain;clog(`<span class="g">${k.n}</span> — +${k.dpGain} deploy points.`,'info');}
    if(k.draw){for(let i=0;i<k.draw;i++)drawCard();clog(`<span class="g">${k.n}</span> — ${k.draw} cards called in.`,'info');}
    if(k.claim){let n=0;
      for(let i=1;i<=k.claim;i++){const cc=c+i;
        if(cc<COLS&&G.ter[l][cc]!=='x'&&G.ter[l][cc]!=='p'&&!foeAt(l,cc)){G.ter[l][cc]='p';n++;}}
      clog(`<span class="g">${k.n}</span> — ${n} cell${n===1?'':'s'} claimed.`,'info');}
    clog(`Deployed <span class="g">${k.n}</span> — lane ${l+1}, col ${c}.`,'order');}
  active.usage=active.usage||{};
  const before=vetOf(cid).t;active.usage[cid]=(active.usage[cid]||0)+1;
  const after=vetOf(cid).t;
  if(after>before)clog(`<span class="g">${k.n} promoted to ${VET[after].n}.</span>`,'info');
  G.dp-=costOf(cid);G.hand.splice(G.hand.indexOf(cid),1);sel=null;mover=null;drawAll();}

function cellPassable(l,c,selfUid){
  if(l<0||l>=LANES||c<0||c>=COLS)return false;
  if(G.ter[l][c]==='x')return false;
  if(foeAt(l,c)||civAt(l,c))return false;
  const o=unitAt(l,c);
  if(o&&o.uid!==selfUid)return false;
  return true;}
function moveTargets(u){if(!u.mob||u.stun||u.acted||u.moved)return[];const out=[];
  [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dl,dc])=>{
    const nl=u.lane+dl,nc=u.col+dc;
    for(let i=0;i<u.size;i++) if(!cellPassable(nl,nc+i,u.uid))return;
    out.push(nl*COLS+nc);});
  return out;}
function doMove(u,l,c){
  if(u.acted||u.moved)return;
  if(!moveTargets(u).includes(l*COLS+c))return;   // never trust the caller
  u.lane=l;u.col=c;u.moved=true;
  if(!u.servo)u.acted=true;
  clog(`${u.n} repositioned${u.servo?' — servo legs, it can still fire':''}.`,'order');
  mover=(u.servo&&!u.acted)?u:null;drawAll();}
function doAttack(u,e){
  if(u.acted)return;
  u.tgt=e?e.uid:null;
  const before=G.enemies.length;
  fire(u,false);
  if(G.enemies.length===before)clog(`${u.n} engaged.`,'order');
  u.acted=true;mover=null;drawAll();}
function doAbility(u){
  if(u.acted||u.cd>0||!u.ab)return;
  useAbility(u);u.acted=true;mover=null;drawAll();}
function buffOf(u){let b=0;
  G.units.forEach(o=>{if(o.uid===u.uid)return;
    if(o.aura&&Math.abs(o.lane-u.lane)+Math.abs(o.col-u.col)===1)b+=o.aura;
    if(o.colBuff&&o.col===u.col)b+=o.colBuff;
    if(o.laneB&&o.lane===u.lane)b+=o.laneB;});
  return Math.min(b,2);}
function laneJammed(l){return G.enemies.some(e=>e.lane===l&&BEST[e.k].jam);}
function laneFloor(e){let f=BEST[e.k].floor||0;
  G.enemies.forEach(o=>{if(BEST[o.k].lanefloor&&o.lane===e.lane)f+=BEST[o.k].lanefloor;});return f;}
function laneAhead(u,L){const front=u.col+u.size-1;
  let list=G.enemies.filter(e=>e.lane===L&&e.col>front).sort((a,b)=>a.col-b.col);
  if(!u.indirect){let lim=COLS;
    for(let c=front+1;c<COLS;c++){const f=unitAt(L,c);if(f&&f.blocker&&f.uid!==u.uid){lim=c;break;}}
    list=list.filter(e=>e.col<lim);}
  return list;}
function geomFor(u){const front=u.col+u.size-1,L=u.lane;
  if(u.tg==='none'||!u.dmg||u.stun)return[];
  if(u.indirect&&laneJammed(L))return[];
  const inLane=laneAhead(u,L);
  switch(u.tg){
    case 'adj':return inLane.filter(e=>e.col===front+1);
    case 'first':return inLane.slice(0,1);
    case 'furthest':return inLane.slice(-1);
    case 'lane':return inLane;
    case 'ahead2':return inLane.filter(e=>e.col<=front+2);
    case 'ahead3':return inLane.filter(e=>e.col<=front+3);
    case 'range2':return G.enemies.filter(e=>e.lane===L&&e.col===front+2);
    case 'range3':return G.enemies.filter(e=>e.lane===L&&e.col===front+3
      &&!G.units.some(f=>f.blocker&&f.uid!==u.uid&&f.lane===L&&f.col>front&&f.col<front+3));
    case 'blast4':{const cc=front+4;return G.enemies.filter(e=>Math.abs(e.lane-L)<=1&&Math.abs(e.col-cc)<=1);}
    case 'around':return G.enemies.filter(e=>Math.abs(e.lane-L)<=1&&Math.abs(e.col-u.col)<=1&&!(e.lane===L&&e.col===u.col));
    case 'bothsides':return G.enemies.filter(e=>e.lane===L&&(e.col===front+1||e.col===u.col-1));
    case 'diag':return G.enemies.filter(e=>Math.abs(e.lane-L)===1&&Math.abs(e.col-u.col)===1);
    case 'vert3':{const cc=front+1;return G.enemies.filter(e=>e.col===cc&&Math.abs(e.lane-L)<=1);}
    case 'adj4':return G.enemies.filter(e=>Math.abs(e.lane-L)+Math.abs(e.col-u.col)===1);
    case 'archer':{const cells=[[L,front+1],[L,front+2],[L-1,u.col-1],[L+1,u.col-1]];
      return G.enemies.filter(e=>cells.some(([cl,cc])=>e.lane===cl&&e.col===cc));}}
  return[];}
function candidatesFor(u){return u.single?geomFor(u):[];}
function targetsFor(u){
  const g=geomFor(u);
  if(!u.single)return g;
  if(!g.length)return[];
  const lk=g.find(e=>e.uid===u.tgt);
  return [lk||g[0]];}
function fire(u,onPlay){
  if(u.tg==='none'||!u.dmg||u.stun)return;
  const k=POOL[u.id];
  const pri=(u.pristine&&u.hp>=u.max)?u.pristine:0;
  const base=(onPlay&&k.burst?k.burst+(u.dmg-(k.dmg||0)):u.dmg)+buffOf(u)+pri;
  for(let s=0;s<(u.att.cannon?2:1);s++){
    const ts=targetsFor(u);if(!ts.length)break;
    ts.forEach(e=>dmgEnemy(e,base,u.n,u.pen));
    if(u.scorch&&ts.length){const t=ts[0];
      for(let dl=-1;dl<=1;dl++)for(let dc=-1;dc<=1;dc++){
        const nl=t.lane+dl,nc=t.col+dc;
        if(nl>=0&&nl<LANES&&nc>=0&&nc<COLS)G.scorch[nl+','+nc]=2;}}}}
function blast(l,c,d,src){if(!d)return;
  G.enemies.filter(e=>Math.abs(e.lane-l)<=1&&Math.abs(e.col-c)<=1).forEach(e=>dmgEnemy(e,d,src));}
function dmgEnemy(e,d,src,pen){
  e.hp-=pen?d:Math.max(1,d-laneFloor(e));
  if(e.hp<=0){G.enemies=G.enemies.filter(x=>x.uid!==e.uid);G.kills++;
    if(G.quotaK===e.k)G.quotaHit++;
    if(G.mod==='salvage')G.dp++;
    clog(`<span class="g">${src}</span> destroyed ${BEST[e.k].n}.`,'kill');
    if(!active.unlocks.enemies.includes(e.k))active.unlocks.enemies.push(e.k);}}
function dampenIn(l){return G.units.some(o=>o.dampen&&o.lane===l)?1:0;}
function dmgUnit(u,d,src,attacker){
  d=Math.max(1,d-dampenIn(u.lane));
  if(u.riposte&&attacker&&attacker.hp>0)dmgEnemy(attacker,u.riposte,u.n+' riposte',false);
  if(u.shield>0){u.shield--;u.att.shield=false;clog(`${u.n}'s shield held.`,'loss');return;}
  u.hp-=d;
  if(u.hp<=0&&u.phase&&!u.phased){u.phased=true;u.hp=1;
    clog(`<span class="g">Phase Cloak</span> — ${u.n} slipped the killing blow.`,'loss');return;}
  if(u.hp<=0){G.units=G.units.filter(x=>x.uid!==u.uid);G.lost++;
    clog(`<span class="d">${src}</span> destroyed your ${u.n}.`,'loss');}}
function healPass(u,onPlay){
  if(u.hot){G.units.filter(o=>o.col===u.col&&o.uid!==u.uid&&!o.tech).forEach(o=>{o.regenTicks=2;});
    return;}
  if(!u.heal)return;
  const k=POOL[u.id],amt=onPlay?(k.healPlay||u.heal):u.heal;
  const list=u.healMode==='front'
    ? G.units.filter(o=>o.lane===u.lane&&o.col===u.col+1)
    : G.units.filter(o=>o.col===u.col&&o.uid!==u.uid);
  list.filter(o=>u.healType==='tech'?o.tech:!o.tech).forEach(o=>{
    if(o.hp<o.max)o.hp=Math.min(o.max,o.hp+amt);});}
function useAbility(u){
  if(!u.ab||u.cd>0)return;
  u.cd=Math.max(1,(u.ab.cd||1)-(u.cool?1:0));
  switch(u.id){
    case 'medic':
      G.units.filter(o=>o.uid!==u.uid&&!o.tech&&Math.abs(o.lane-u.lane)+Math.abs(o.col-u.col)===1)
        .forEach(o=>{o.hp=Math.min(o.max,o.hp+4);});
      clog('<span class="g">Triage</span> — adjacent personnel patched.','order');break;
    case 'bulwark':u.shield=(u.shieldMax||1)+1;clog(`<span class="g">Brace</span> — ${u.n} braced.`,'order');break;
    case 'aegis':G.units.filter(o=>o.lane===u.lane).forEach(o=>{o.shield=Math.max(o.shield,1);});
      clog(`<span class="g">Aegis Field</span> — lane ${u.lane+1} shielded.`,'order');break;
    case 'techmed':G.units.filter(o=>o.col===u.col&&o.tech).forEach(o=>{
        o.hp=Math.min(o.max,o.hp+8);if(o.att.shield===false){o.att.shield=true;o.shield=1;}});
      clog('<span class="g">Full Restore</span> — column tech repaired.','order');break;
    case 'dragoon':{
      const pool2=G.enemies.filter(e=>Math.abs(e.lane-u.lane)+Math.abs(e.col-u.col)===2);
      const t=pool2.find(e=>e.uid===u.tgt)||pool2.sort((a,b)=>b.hp-a.hp)[0];
      if(t){dmgEnemy(t,6+buffOf(u),'Thruster Leap',u.pen);clog('<span class="g">Thruster Leap</span> — vaulted and struck.','order');}
      else clog('Thruster Leap found no target at range two.','order');break;}
    case 'exo':{
      let hit=null;
      for(let s=1;s<=2;s++){const e=foeAt(u.lane,u.col+s);if(e){hit=e;break;}}
      if(hit){dmgEnemy(hit,8+buffOf(u),'Hammer Charge',u.pen);
        if(hit.hp>0)hit.stun=1;
        clog('<span class="g">Hammer Charge</span> — impact.','order');}
      else{const nc=Math.min(COLS-1,u.col+2);
        if(!unitAt(u.lane,nc)&&!foeAt(u.lane,nc)){u.col=nc;clog('Hammer Charge — ground gained.','order');}}
      break;}}}

function playerPhase(){
  // anything the player did not commit this turn falls back to firing
  G.units.forEach(u=>{
    if(u.fresh||u.acted)return;
    fire(u,false);healPass(u,false);});
  G.units.forEach(u=>{
    u.acted=false;u.moved=false;u.fresh=false;
    if(u.tgt&&!G.enemies.some(e=>e.uid===u.tgt))u.tgt=null;
    if(u.cd>0)u.cd--;
    if(u.stun>0)u.stun--;
    if(u.regenTicks>0){u.hp=Math.min(u.max,u.hp+2);u.regenTicks--;}
    if(leadOf().passive&&leadOf().passive.n==='Nanite Weave')u.hp=Math.min(u.max,u.hp+1);
    if(u.regen)u.shield=Math.max(u.shield,u.shieldMax||1);});}
function enemyPhase(){
  const chorus=G.enemies.some(e=>BEST[e.k].aura)?1:0;
  [...G.enemies].forEach(e=>{
    if(e.hp<=0)return;
    if(e.stun){e.stun--;return;}
    const D=BEST[e.k];
    if(D.spawn){e.acc=(e.acc||0)+1;
      if(e.acc>=D.spawn){e.acc=0;let c=e.col;
        while(c>0&&(foeAt(e.lane,c)||unitAt(e.lane,c)))c--;
        if(c>=0&&!foeAt(e.lane,c)&&!unitAt(e.lane,c)){
          G.enemies.push({uid:++uid,k:'crawler',lane:e.lane,col:c,hp:BEST.crawler.hp,acc:0,mv:0,stun:0,src:'spore'});
          clog('<span class="d">Spore Node</span> released a Crawler.','wave');}}
      return;}
    if(D.spd===0)return;
    if(D.hold!==undefined&&e.col<=D.hold){strike(e,D,chorus);return;}
    const ahead=e.col-1;
    const blocked=ahead>=0&&((unitAt(e.lane,ahead)&&!D.tunnel)||civAt(e.lane,ahead));
    const queued=ahead>=0&&foeAt(e.lane,ahead);
    if(blocked||queued){strike(e,D,chorus,queued&&!blocked);return;}
    e.mv=(e.mv||0)+D.spd;
    let steps=0;while(e.mv>=1){steps++;e.mv--;}
    for(let s=0;s<steps;s++){const nc=e.col-1;
      if(nc<0){G.breaches++;G.enemies=G.enemies.filter(x=>x.uid!==e.uid);
        clog(`<span class="d">BREACH</span> — ${D.n} crossed the line.`,'loss');break;}
      if(G.ter[e.lane][nc]==='x')break;
      if((unitAt(e.lane,nc)&&!D.tunnel)||foeAt(e.lane,nc)||civAt(e.lane,nc))break;
      if(scorched(e.lane,nc))dmgEnemy(e,2,'Plasma');
      if(e.hp<=0)break;
      e.col=nc;
      if(D.convert)G.ter[e.lane][nc]='e';
      if(D.hold!==undefined&&e.col<=D.hold)break;}});}
function strike(e,D,chorus,pressing){
  const cv=civAt(e.lane,e.col-1);
  if(cv){cv.hp-=D.dmg+chorus;
    if(cv.hp<=0)clog('<span class="d">A civilian pod was destroyed.</span>','loss');
    return;}
  let t=null;for(let c=e.col-1;c>=0;c--){const u=unitAt(e.lane,c);if(u){t=u;break;}}
  if(t)dmgUnit(t,D.dmg+chorus,D.n+(pressing?' (pressing)':''),e);}
function territoryPhase(){
  for(let l=0;l<LANES;l++)for(let c=0;c<COLS;c++){
    if(G.ter[l][c]==='x')continue;
    const u=unitAt(l,c),e=foeAt(l,c);
    if(e&&!scorched(l,c))G.ter[l][c]='e';else if(u||civAt(l,c))G.ter[l][c]='p';}
  Object.keys(G.scorch).forEach(k=>{G.scorch[k]--;if(G.scorch[k]<=0)delete G.scorch[k];});}
// a hostile landing on one of your units fights its way in
function spawnClash(k,D,u){
  const eDmg=Math.max(1,(D.dmg||0)-dampenIn(u.lane));
  const uDmg=Math.max(0,(u.dmg||0)+(u.riposte||0)+buffOf(u));
  const uNet=u.pen?uDmg:Math.max(0,uDmg-(BEST[k].floor||0));
  if(!D.dmg)return{outcome:'repelled',eHp:0,uHp:u.hp};   // emplacements cannot force a landing
  const uEff=u.hp+(u.shield||0)*eDmg;                    // each shield charge eats one blow
  const rU=Math.ceil(uEff/eDmg);
  const rE=uNet>0?Math.ceil(D.hp/uNet):Infinity;
  if(rE<rU)  return{outcome:'repelled',eHp:0,uHp:Math.max(1,u.hp-eDmg*rE)};
  if(rE===rU)return{outcome:'mutual',  eHp:0,uHp:0};
  return{outcome:'landed',eHp:Math.max(1,D.hp-uNet*rU),uHp:0};}

function resolveSpawn(k,lane){
  const D=BEST[k];
  let start=D.emerge!==undefined?D.emerge:COLS-1;
  if(D.spd===0)start=5+((Math.random()*3)|0);
  const free=c=>c>=0&&c<COLS&&!unitAt(lane,c)&&!foeAt(lane,c)&&!civAt(lane,c);

  // the drop point itself is free — straightforward landing
  if(free(start)){
    G.enemies.push({uid:++uid,k,lane,col:start,hp:D.hp,mv:0,acc:0,stun:0});return true;}

  // your unit is standing on the drop point — it gets fought for
  const onPoint=unitAt(lane,start);
  if(onPoint)return dropFight(k,D,onPoint);

  // drop point held by another hostile — find any open cell in the promised lane
  for(let c=start+1;c<COLS;c++)if(free(c)){
    G.enemies.push({uid:++uid,k,lane,col:c,hp:D.hp,mv:0,acc:0,stun:0});return true;}
  for(let c=start-1;c>=0;c--)if(free(c)){
    G.enemies.push({uid:++uid,k,lane,col:c,hp:D.hp,mv:0,acc:0,stun:0});return true;}

  // lane completely packed — fight the unit nearest the edge for its cell
  let tgt=null;
  for(let c=COLS-1;c>=0;c--){const u=unitAt(lane,c);if(u){tgt=u;break;}}
  return tgt?dropFight(k,D,tgt):false;}

function dropFight(k,D,u){
  const r=spawnClash(k,D,u);
  if(r.outcome==='repelled'){
    if(!D.dmg){clog(`<span class="d">${D.n}</span> could not force a landing — held at the edge.`,'wave');return false;}
    u.hp=r.uHp;
    clog(`<span class="g">${u.n}</span> held the drop zone and destroyed an incoming ${D.n}.`,'kill');
    G.kills++;if(!active.unlocks.enemies.includes(k))active.unlocks.enemies.push(k);
    return true;}
  const l=u.lane,uc=u.col,un=u.n;
  G.units=G.units.filter(x=>x.uid!==u.uid);G.lost++;
  if(r.outcome==='mutual'){
    clog(`<span class="d">${D.n}</span> and your <span class="g">${un}</span> destroyed each other on the drop.`,'loss');
    G.kills++;if(!active.unlocks.enemies.includes(k))active.unlocks.enemies.push(k);
    return true;}
  G.enemies.push({uid:++uid,k,lane:l,col:uc,hp:r.eHp,mv:0,acc:0,stun:0});
  clog(`<span class="d">${D.n}</span> landed on your ${un} and destroyed it — it arrives at ${r.eHp}/${D.hp} hull.`,'loss');
  return true;}

function spawnPhase(){
  const queue=(G.held||[]).concat(G.predict||[]);
  G.held=[];G.predict=[];
  if(!queue.length)return;
  queue.forEach(({lane,k})=>{
    if(G.ter[lane][0]==='x'){G.held.push({lane,k});return;}
    if(!resolveSpawn(k,lane))G.held.push({lane,k});});
  if(G.held.length)clog(`<span class="d">${G.held.length} hostile${G.held.length>1?'s':''} held at the edge</span> — no way into the marked lane.`,'wave');}
function drawCard(){if(!G.deck.length){
    const back=active.loadout.deck.filter(c=>POOL[c]&&!G.hand.includes(c));
    if(!back.length)return;G.deck=shuffle([...back]);
    clog('<span class="t">Reserve cycled</span> — fresh requisition available.','info');}
  G.hand.push(G.deck.pop());}
function endTurn(){
  if(!G||G.over||!active)return;
  playerPhase();enemyPhase();territoryPhase();
  if(G.type==='civilians'&&G.civ.every(v=>v.hp<=0))return finish(false,'All civilian pods lost.');
  if(G.breaches>=MAXBREACH)return finish(false,'Three breaches.');
  if(held()<6)return finish(false,'Ground lost — no viable deployment line.');
  if(G.type==='specimens'&&G.quotaHit>=G.quota)return finish(true);
  const wasLast=G.turn>=G.waves;
  spawnPhase();                       // deliver exactly what the markers promised
  if(!wasLast){G.turn++;G.manifest=wave(G.turn);G.doctrine=rollDoctrine();predictSpawns();
    clog(`<span class="t">WAVE ${G.turn}</span> inbound — entry lanes marked.`,'wave');}
  else{G.manifest=null;G.predict=[];G.extra++;
    if(G.extra===1)clog('<span class="t">LAST WAVE COMMITTED</span> — hold the line.','wave');
    if(G.type==='retake'){if(heldEnemyHalf()>=3)return finish(true);
      if(G.extra>=3)return finish(false,'Not enough hostile ground taken.');}
    else if(G.type==='crystals'){if(crystalsHeld()>=3)return finish(true);
      if(G.extra>=3)return finish(false,`Only ${crystalsHeld()} of 4 crystal nodes held.`);}
    else if(G.type==='specimens'){if(G.quotaHit>=G.quota)return finish(true);
      if(G.extra>=3)return finish(false,`Quota short — ${G.quotaHit} of ${G.quota}.`);}
    else if(!G.enemies.length||G.extra>=2)return finish(true);}
  G.dp=MAXDP;for(let i=0;i<2;i++)drawCard();
  sel=null;mover=null;drawAll();}

function packOffer(tier){
  // tier: 'standard' (any unowned) | 'specialist' (Specialist cards only)
  const owned=active.unlocks.cards||[];
  const pool=Object.keys(POOL).filter(id=>!owned.includes(id)&&
    (tier==='specialist'?POOL[id].t==='special':true));
  const out=[];
  const take=(arr,n)=>{const c=[...arr];while(out.length<n&&c.length)
    out.push({kind:'card',id:c.splice((Math.random()*c.length)|0,1)[0]});};
  if(tier==='specialist'&&pool.length)take(pool,3);
  else if(pool.length)take(pool,3);
  // running dry: fall back to gear, then to veterancy and salvage
  if(out.length<3){
    const g=Object.keys(GEAR).filter(k=>!(active.unlocks.gear||[]).includes(k));
    const c=[...g];while(out.length<3&&c.length)
      out.push({kind:'gear',id:c.splice((Math.random()*c.length)|0,1)[0]});}
  if(out.length<3){
    const deck=(active.loadout.deck||[]).filter(id=>POOL[id]);
    const c=[...deck];
    while(out.length<3&&c.length)
      out.push({kind:'vet',id:c.splice((Math.random()*c.length)|0,1)[0],amount:12});
    while(out.length<3)out.push({kind:'salvage',amount:40});}
  return out;}

function claimPack(pick){
  if(pick.kind==='card'){
    if(!active.unlocks.cards.includes(pick.id))active.unlocks.cards.push(pick.id);
    if(active.loadout.deck.length<DECKSIZE&&!active.loadout.deck.includes(pick.id))
      active.loadout.deck.push(pick.id);}
  else if(pick.kind==='gear'){
    if(!active.unlocks.gear.includes(pick.id))active.unlocks.gear.push(pick.id);}
  else if(pick.kind==='vet'){
    active.usage=active.usage||{};
    active.usage[pick.id]=(active.usage[pick.id]||0)+pick.amount;}
  else if(pick.kind==='salvage')active.progress.salvage+=pick.amount;
  commit();}

function finish(win,why){G.over=true;
  const r=$('rcard');r.className='rcard '+(win?'win':'lose');

    const best=Math.max(active.bests.onslaught||0,G.turn);
    const rec=best>(active.bests.onslaught||0);active.bests.onslaught=best;
    cr=G.turn*12;sv=Math.floor(G.turn*1.5);
    active.progress.credits+=cr;active.progress.salvage+=sv;
    active.stats.deployments++;active.stats.kills+=G.kills;commit();
    const packs=Math.floor(G.turn/5);
    for(let i=0;i<packs;i++)queuePack('standard',`Onslaught · wave ${(i+1)*5}`);
    $('rt').textContent='ONSLAUGHT ENDED';r.className='rcard lose';
    $('rs').innerHTML=`Waves survived · <b style="color:var(--cyan)">${G.turn}</b>${rec?' — new best':''}<br>
      Personal best · ${active.bests.onslaught}<br>Hostiles destroyed · ${G.kills}
      <br><br><b style="color:var(--gold)">+${cr} credits</b> · <b style="color:var(--cyan)">+${sv} salvage</b>`;
    $('result').classList.add('on');drawAll();return;}
  if(G.gauntlet){

      active.progress.credits+=cr;active.progress.salvage+=sv;active.stats.held++;
      const done=active.gaunt.i>=4;
      queuePack('standard','Gauntlet leg cleared');
      if(done){active.bests.gauntlet=(active.bests.gauntlet||0)+1;
        cr+=250;active.progress.credits+=250;active.gaunt=null;
        queuePack('specialist','Gauntlet complete');}
      $('rt').textContent=done?'GAUNTLET COMPLETE':`LEG ${active.gaunt?active.gaunt.i:4} CLEARED`;
    }else{active.gaunt=null;active.stats.lost++;
      $('rt').textContent='GAUNTLET BROKEN';}
    active.stats.deployments++;active.stats.kills+=G.kills;commit();
    $('rs').innerHTML=`${why?why+'<br>':''}Hostiles destroyed · ${G.kills}<br>Units lost · ${G.lost}
      ${win?`<br><br><b style="color:var(--gold)">+${cr} credits</b> · <b style="color:var(--cyan)">+${sv} salvage</b>`:''}`;
    $('result').classList.add('on');drawAll();return;}
  if(win){cr=G.reward;sv=G.salv+Math.floor(G.kills/5);
    active.progress.credits+=cr;active.progress.salvage+=sv;
    opRun().cleared.push(G.node);

  active.stats.deployments++;active.stats.kills+=G.kills;
  active.stats.unitsLost+=G.lost;active.stats.breaches+=G.breaches;commit();
  $('rs').innerHTML=`${why?why+'<br>':''}Hostiles destroyed · ${G.kills}<br>Units lost · ${G.lost}<br>Ground held · ${held()} tiles${win?`<br><br><b style="color:var(--gold)">+${cr} credits</b> · <b style="color:var(--cyan)">+${sv} salvage</b>`:''}`;
  $('result').classList.add('on');drawAll();}

function supportTargets(u){
  // cells this unit is helping (buff, heal, regen) — rendered blue
  const out=[];
  const add=o=>{for(let i=0;i<(o.size||1);i++)out.push(o.lane*COLS+o.col+i);};
  if(u.aura)G.units.forEach(o=>{if(o.uid!==u.uid&&Math.abs(o.lane-u.lane)+Math.abs(o.col-u.col)===1)add(o);});
  if(u.colBuff)G.units.forEach(o=>{if(o.uid!==u.uid&&o.col===u.col)add(o);});
  if(u.laneB)G.units.forEach(o=>{if(o.uid!==u.uid&&o.lane===u.lane)add(o);});
  if(u.heal||u.hot){
    const want=u.healType==='tech';
    if(u.healMode==='front')G.units.forEach(o=>{if(o.lane===u.lane&&o.col===u.col+1&&(!!o.tech===want))add(o);});
    else G.units.forEach(o=>{if(o.uid!==u.uid&&o.col===u.col&&(!!o.tech===want))add(o);});}
  return out;}
function influenceCells(u){

function supportLabel(u){

  if(u.colBuff)return 'Buffing this column';
  if(u.laneB)return 'Buffing this lane';
  if(u.hot)return 'Regenerating '+(u.healType==='tech'?'Tech':'personnel')+' in column';
  if(u.heal)return 'Healing '+(u.healMode==='front'?'the unit ahead':(u.healType==='tech'?'Tech in column':'personnel in column'));
  if(u.dampen)return 'Damping hostile damage in this lane';

function forecastThreat(){
  const hits={},atk={};
  G.enemies.forEach(e=>{
    const D=BEST[e.k];
    if(D.spd===0||e.stun)return;
    let will=false;
    if(D.hold!==undefined&&e.col<=D.hold)will=true;
    else{const ahead=e.col-1;
      if(ahead>=0&&(((unitAt(e.lane,ahead)&&!D.tunnel))||civAt(e.lane,ahead)||foeAt(e.lane,ahead)))will=true;}
    if(!will)return;
    let t=null;for(let c=e.col-1;c>=0;c--){const uu=unitAt(e.lane,c);if(uu){t=uu;break;}}
    const cvv=civAt(e.lane,e.col-1);
    atk[e.uid]=true;
    if(cvv)hits['c'+cvv.l+','+cvv.c]=(hits['c'+cvv.l+','+cvv.c]||0)+D.dmg;
    else if(t)hits[t.uid]=(hits[t.uid]||0)+Math.max(1,D.dmg-dampenIn(t.lane));});
  return{hits,atk};}

        u.acted?'Action committed for this turn'
        :!g.length?'No target in range — it will hold'
        :canChoose?`<b>${g.length}</b> targets in reach — tap one in gold to strike`
        :u.single?`Will strike ${BEST[ts[0].k].n} for <b>${dmg}</b>`
        :`Will strike ${g.length} hostile${g.length>1?'s':''} for <b>${dmg}</b> each`}</div>
      ${!u.acted&&u.mob?'<div class="hintline">Tap a green tile to reposition.</div>':''}
      ${u.ab&&!u.acted?`<div class="selacts">
        <button class="mini" data-useab="1"${u.cd>0?' disabled':''}>${u.cd>0?`${u.ab.n} (${u.cd})`:u.ab.n}</button></div>
        <div class="abline"><b>${u.ab.n}</b> ${u.ab.d}</div>`:''}`;
    const b=el.querySelector('[data-useab]');if(b&&!u.cd)b.onclick=()=>doAbility(u);
    return;}
  if(sel){const k=POOL[sel],g=gearOf(sel);
    el.innerHTML=`<div class="selhead"><b style="color:var(--green)">${k.n}</b>
        <span class="hpbadge">${costOf(sel)} DP</span></div>
      <div class="selgrid">
        ${k.hp?`<div><span>Hull</span><b>${k.hp+(g&&g.hp?g.hp:0)}</b></div>`:''}
        ${k.dmg?`<div><span>Damage</span><b>${k.dmg+(g&&g.dmg?g.dmg:0)}</b></div>`:''}
        ${k.tg&&k.tg!=='none'?`<div><span>Targeting</span><b>${TGNAME[k.tg]}</b></div>`:''}
        <div><span>Deploy</span><b>${k.drop?'Any tile':'Held tiles'}</b></div>
      </div>
      <div class="selfire live">Tap a lit tile to deploy</div>
      <div class="abline">${k.d}</div>`;
    return;}
  const th=forecastThreat(),n=Object.keys(th.hits).length;
  const ready=G.units.filter(u=>!u.acted).length;
  el.innerHTML=`Nothing selected.<div style="margin-top:7px">Tap a card to deploy, or a unit to act with it.</div>
    ${ready?`<div class="selfire live" style="margin-top:9px"><b>${ready}</b> unit${ready>1?'s':''} still to act</div>`:''}
    ${n?`<div class="selfire dead" style="margin-top:7px"><b style="color:var(--mag)">${n}</b> of your positions will be struck this turn</div>`:''}`;}
function drawBoard(){
  const valid=sel?validTiles(sel):[],mtg=mover?moveTargets(mover):[];
  const th=forecastThreat();
  const willHit=new Set(),aimSet=new Set();
  if(mover&&!mover.acted){
    targetsFor(mover).forEach(e=>willHit.add(e.lane*COLS+e.col));
    (mover.single?candidatesFor(mover):geomFor(mover))
      .forEach(e=>aimSet.add(e.lane*COLS+e.col));}
  const buffSet=new Set(),inflSet=new Set();
  if(mover){supportTargets(mover).forEach(i=>buffSet.add(i));
    influenceCells(mover).forEach(i=>inflSet.add(i));}
  const spawnLanes={};
  if(G.mod!=='blackout')(G.predict||[]).concat(G.held||[]).forEach(p=>{
    spawnLanes[p.lane]=(spawnLanes[p.lane]||0)+1;});
  const bd=$('board');bd.style.gridTemplateColumns=`repeat(${COLS},1fr)`;bd.innerHTML='';
  for(let l=0;l<LANES;l++)for(let c=0;c<COLS;c++){
    const i=l*COLS+c,own=G.ter[l][c];
    const d=document.createElement('div');
    let cls='cell '+(own==='p'?'t-p':own==='e'?'t-e':own==='x'?'t-x':'t-n');
    if(scorched(l,c))cls+=' scorch';
    if(G.crystals.some(x=>x.l===l&&x.c===c))cls+=' objtile';
    if(valid.includes(i))cls+=' valid';
    if(mtg.includes(i))cls+=' movetgt';
    if(mover&&mover.lane===l&&mover.col===c)cls+=' movesel';
    if(willHit.has(i))cls+=' willhit';
    if(buffSet.has(i))cls+=' buffed';
    if(aimSet.has(i))cls+=' aimable';
    d.className=cls;
    let inner='';
    if(c===COLS-1&&spawnLanes[l])inner+=`<span class="spawnmark">◀${spawnLanes[l]>1?spawnLanes[l]:''}</span>`;
    const u=unitAt(l,c),e=foeAt(l,c),v=civAt(l,c);
    if(u&&u.col===c){
      const kk=u.t==='special'?'p-spec':u.tech?'p-struct':'p-unit';
      const ord=u.acted?'<span class="ord done">✓</span>':'';
      const inc=th.hits[u.uid]||0;
      if(inc)cls+=' underthreat',d.className=cls;
      inner+=`<div class="ent ${kk}${u.size>1?' anchor':''}${u.stun?' stunned':''}${u.acted?' spent':''}">
        ${inc?`<span class="incdmg">-${inc}</span>`:''}
        ${u.tgt?'<span class="lockpip">⌖</span>':''}
        <span class="minihp"><i style="width:${Math.max(0,u.hp/u.max*100)}%"></i></span>
        ${u.shield>0?`<span class="shield">${'◈'.repeat(Math.min(u.shield,2))}</span>`:''}
        ${u.att.cannon?'<span class="att">▮</span>':''}${ord}
        <div class="nm">${u.n.split(' ')[0]}${u.size>1?'▸':''}</div><div class="hp">${u.hp}</div></div>`;
      d.innerHTML=inner;
      if(!sel&&!G.over&&!u.acted){d.classList.add('clickable');
        d.onclick=()=>{mover=(mover&&mover.uid===u.uid)?null:u;drawAll();};}
    }else if(u){d.innerHTML=inner+`<div class="ent p-unit anchor"><div class="nm">◂</div></div>`;}
    else if(v){d.innerHTML=inner+`<div class="ent p-civ"><div class="nm">CIV</div><div class="hp">${v.hp}</div></div>`;}
    else if(e){const D=BEST[e.k],kk=D.t==='special'?'e-spec':D.t==='tech'?'e-tech':'e-unit';
      const locked=G.units.some(u=>u.tgt===e.uid);
      d.innerHTML=inner+`<div class="ent ${kk}${e.stun?' stunned':''}">
        ${th.atk[e.uid]?'<span class="striking">!</span>':''}
        ${locked?'<span class="lockpip">⌖</span>':''}
        <span class="minihp foe"><i style="width:${Math.max(0,e.hp/BEST[e.k].hp*100)}%"></i></span>
        <div class="nm">${D.n.split(' ')[0]}</div><div class="hp">${e.hp}</div></div>`;
      d.classList.add('clickable');
      if(aimSet.has(i)&&mover&&!mover.acted)d.onclick=()=>doAttack(mover,e);
            else d.onclick=()=>focusEnemy(e.k);}
    else d.innerHTML=inner;
    if(valid.includes(i))d.onclick=()=>deploy(sel,l,c);
    else if(mtg.includes(i))d.onclick=()=>doMove(mover,l,c);
    else if(!d.onclick&&(sel||mover))d.onclick=()=>{sel=null;mover=null;drawAll();};
    bd.appendChild(d);}
  const tot=LANES*COLS,p=held(),en=G.ter.flat().filter(t=>t==='e').length;
  $('terbar').innerHTML=`<i class="p" style="width:${p/tot*100}%"></i><i class="n" style="width:${(tot-p-en)/tot*100}%"></i><i class="e" style="width:${en/tot*100}%"></i>`;}
function drawHand(){const h=$('hcards');h.innerHTML='';
  G.hand.forEach(cid=>{const k=POOL[cid],cost=costOf(cid),poor=cost>G.dp||G.over,g=gearOf(cid);
    const el=document.createElement('div');
    const v=vetOf(cid);
    el.className=`hc t-${k.t} v${v.t}`+(poor?' poor':'')+(sel===cid?' sel':'');
    el.innerHTML=`<div class="zoom" data-z="${cid}">⌕</div>${v.t?`<div class="hpips">${'◆'.repeat(v.t)}</div>`:''}
      <div class="n"><span>${k.n}</span><span>${cost}</span></div>
      <div class="d">${k.d}</div>${g?`<div class="gtag">${g.n}</div>`:''}`;
    el.onclick=ev=>{if(ev.target.dataset.z){focusCard(cid,'hand');return;}
      if(poor)return;sel=sel===cid?null:cid;mover=null;drawAll();};
    h.appendChild(el);});
  if(!G.hand.length)h.innerHTML='<div style="font-size:0.5625rem;color:var(--dim)">Hand empty — hold with what is on the board.</div>';}

function cardEl(id,mode){const k=POOL[id],g=gearOf(id);
  const owned=active.unlocks.cards.includes(id),inDeck=active.loadout.deck.includes(id);
  const can=active.progress.credits>=k.price;
  let foot='',cls='';
  if(mode==='shop'){foot=owned?'<div class="gfoot own">Owned</div>':k.price===0?'<div class="gfoot own">Issued</div>'
    :can?`<div class="gfoot buy">${k.price} cr</div>`:`<div class="gfoot no">${k.price} cr</div>`;
    cls=owned?' owned':(!can&&k.price>0?' cant':'');}
  else if(mode==='deck'||mode==='gear'){foot=inDeck?'<div class="gfoot rem">In deck</div>'
    :(active.loadout.deck.length>=DECKSIZE?'<div class="gfoot no">Deck full</div>':'<div class="gfoot add">Add</div>');
    cls=inDeck?' indeck':'';}
  else foot='<div class="gfoot no">Inspect</div>';
  const v=vetOf(id);
  const tip=`${k.n} — ${TIERNAME[k.t]} · ${costOf(id)} DP${k.hp?' · '+(k.hp+(g&&g.hp?g.hp:0))+' hull':''}\n${k.d}${g?'\nGear: '+g.n+' — '+g.d:''}${v.t?'\nRank: '+v.n+' ('+v.u+' deployments)':''}`;
  return `<button class="gcard t-${k.t}${cls} v${v.t}" title="${tip.replace(/"/g,'&quot;')}" data-focus="${id}" data-mode="${mode}">
    <div class="gart">${sigil(id,k.t,null,v.t>=2?v.col:null)}<div class="gcost">${costOf(id)}</div>
      ${k.hp?`<div class="ghp">${k.hp+(g&&g.hp?g.hp:0)} HP</div>`:''}
      ${v.t?`<div class="pips">${'◆'.repeat(v.t)}</div>`:''}</div>
    <div class="gname">${k.n}</div>
    <div class="gtype">${TIERNAME[k.t]}${k.attach?' · Attach':''}${k.size>1?' · 2 cells':''}${k.mob||k.attach?'':' · Anchored'}</div>
    <div class="gtxt">${k.d}</div>${g?`<div class="gtag">◈ ${g.n}</div>`:''}${foot}</button>`;}

function boot(){
  addEventListener('error',ev=>{
    const m=(ev&&ev.message)||'Unknown error';
    try{notify('Something broke',m+'<br><br>Your progress is saved. Returning to the hold.');}catch(e){}
    try{if(active){G=null;show('hold');paintHold();}else{show('boot');renderSlots();}}catch(e){}
  });
  $('cancelnew').onclick=()=>$('newform').classList.remove('on');
  $('create').onclick=()=>{const v=$('callsign').value.trim();if(!v)return;
    const p=blankProfile(v);profiles.push(p);saveAll(profiles);
    $('newform').classList.remove('on');$('callsign').value='';enter(p);};
  $('callsign').addEventListener('keydown',e=>{if(e.key==='Enter')$('create').click();});
  $('switch').onclick=()=>{commit();stopSky();active=null;show('boot');renderSlots();};
  $('gomap').onclick=()=>{stopSky();show('modes');renderModes();};
  $('renameship').onclick=e=>{e.stopPropagation();renameShip();};
  $('dlgok').onclick=()=>dlgClose($('dlginput').style.display==='block'?$('dlginput').value:true);
  $('dlgno').onclick=()=>dlgClose(false);
  $('dlgx').onclick=()=>dlgClose(false);
  $('dlginput').addEventListener('keydown',e=>{if(e.key==='Enter')$('dlgok').click();});
  $('modesback').onclick=()=>{show('hold');startSky();paintHold();};
  $('opsback').onclick=()=>{show('modes');renderModes();};
  $('mapback').onclick=()=>{show('ops');renderOps();};
  $('rok').onclick=()=>{$('result').classList.remove('on');
    const wasG=G&&G.gauntlet,wasE=G&&G.endless,ok=$('rt').textContent.indexOf('CLEARED')>=0;
    G=null;
    const go=()=>{
    if(wasE||(wasG&&!ok)){show('modes');renderModes();return;}
    if(wasG&&active.gaunt&&active.gaunt.i<4){launchGauntlet();return;}
    if(wasG){show('modes');renderModes();return;}
    if(opRun().cleared.length>=MAPDEF.nodes.length)genRun();
    show('map');renderMap();};
    afterPacks=go;
    if(!showPack())go();};
  $('pclose').onclick=()=>$('panel').classList.remove('on');
  $('fbg').onclick=closeFocus;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));
  addEventListener('resize',()=>{if(raf)sizeSky();if(G&&$('combat').classList.contains('on'))drawBoard();});
  addEventListener('keydown',e=>{
    if($('focus').classList.contains('on')){if(e.key==='Escape')closeFocus();return;}
    if($('combat').classList.contains('on')&&G){
      if(e.key===' '){e.preventDefault();const p=$('actPrimary');if(p&&!p.disabled&&p.onclick)p.onclick();}
      if(e.key==='Escape'){sel=null;mover=null;drawAll();}return;}
    if(e.key==='Escape')$('panel').classList.remove('on');});
  setInterval(()=>{if(active)commit();},20000);
  addEventListener('beforeunload',commit);
  renderSlots();
}
boot();

</script>
</body>
</html>
